name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env: { DATABASE_URL: "sqlite+aiosqlite:///./ci.db" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  e2e:
    # Mock providers keep CI deterministic and free. Run the same suite against a
    # staging deploy with real providers before release (docs/testing.md).
    needs: [api, web]
    runs-on: ubuntu-latest
    env:
      BRIDGE_ENV: test
      ALLOW_MOCK_PROVIDERS: "true"
      STT_PROVIDER: mock
      TRANSLATION_PROVIDER: mock
      TTS_PROVIDER: mock
      SECRET_KEY: ci-secret-key-0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      STATIC_DIR: ../../apps/web/out
      CORS_ORIGINS: http://localhost:8000
      E2E_BASE_URL: http://localhost:8000
      E2E_MOCK: "1"
      RATE_JOIN_PER_MINUTE: "200"
      RATE_CREATE_ROOM_PER_HOUR: "200"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -r services/api/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - name: Start API
        working-directory: services/api
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - run: npx playwright test --project=desktop --project=mobile --project=iphone
        working-directory: apps/web
      - if: failure()
        run: cat services/api/api.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
