<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · BRIDGE</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif;
             background: #f6f4ef; color: #14171c; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #0d1013; color: #eceff2; } }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { line-height: 1.5; opacity: 0.8; }
      button { margin-top: 16px; min-height: 48px; padding: 0 24px; border-radius: 12px; border: 0;
               background: #0e5a5e; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>BRIDGE needs a connection to translate conversations. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
